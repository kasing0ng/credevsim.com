<!DOCTYPE html>

<head>

    <script>
        // This function will wait until the entire page (including scripts) is loaded
        window.addEventListener('DOMContentLoaded', () => {
            
            // Now we are sure the 'supabase' library is available
            const supabaseClient = supabase.createClient('https://zjpopvttlslhoopvmqsb.supabase.co', 'sb_publishable_Cwj_h10p92CFrSFSW4yzzQ_Eckr2fWJ');

            // Use the UI components
            const { Auth } = window.supabaseAuthUI;
            const auth = new Auth(supabaseClient);
            
            auth.render({
                container: '#supabase-auth-ui',
                providers: ['email'],
            });
        });
    </script>
