<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Commercial Real Estate Underwriting Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0b0f19; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        h2 { margin-top: 0; text-align: center; }
        .container { width: 350px; background: #1f2937; padding: 30px; border-radius: 8px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 4px; border: 1px solid #374151; background: #111827; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .login-link { text-align: center; margin-top: 15px; font-size: 14px; color: #9ca3af; }
        .login-link a { color: #3b82f6; text-decoration: none; }
        #msg { text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <a href="https://credevsim.com" class="nav-home">← Home</a>
    
    <div class="container">
        <h2>Register</h2>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <input type="checkbox" id="terms" required> I agree to the <a href="terms.html">Terms and Conditions</a>.
        <button id="signup-btn">Sign Up</button>
        <p id="msg"></p>
        <div class="login-link">
            Already have an account? Login via the application.
            </div>
    </div>

    <script>
        // This wrapper (function() { ... })(); protects your code from errors
        (function() {
            // Use 'var' to prevent redeclaration errors
            var client = supabase.createClient('https://zjpopvttlslhoopvmqsb.supabase.co', 'sb_publishable_Cwj_h10p92CFrSFSW4yzzQ_Eckr2fWJ');

            document.getElementById('signup-btn').addEventListener('click', async function() {
                var email = document.getElementById('email').value;
                var password = document.getElementById('password').value;
                var msg = document.getElementById('msg');
                
                msg.innerText = "Signing up...";

                var { error } = await client.auth.signUp({
                    email: email,
                    password: password,
                });

                if (error) {
                    msg.innerText = "Error: " + error.message;
                } else {
                    msg.innerText = "Success! Please check your email to verify.";
                }
            });
        })();
    </script>
</body>
</html>
