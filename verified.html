<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Verification</title>
    <style>
        body { background: #0b0f19; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .box { background: #1f2937; padding: 40px; border-radius: 8px; max-width: 400px; }
    </style>
</head>
<body>
    <div class="box" id="messageBox">
        <h1>Verifying...</h1>
        <p>Please wait while we confirm your email.</p>
    </div>

    <script>
        function updateMessage() {
            const messageBox = document.getElementById('messageBox');
            // Get the URL and check for error parameters
            const hash = window.location.hash; 
            const params = new URLSearchParams(window.location.search);
            
            // Check for specific Supabase error codes
            const errorDescription = params.get('error_description') || "";
            
            if (hash.includes("error_code=otp_expired") || errorDescription.includes("expired")) {
                messageBox.innerHTML = "<h1>Link Expired</h1>" +
                    "<p>This verification link has already been used or has expired. " +
                    "Please try logging in to the app to request a new verification email.</p>";
            } 
            else if (hash.includes("access_denied")) {
                messageBox.innerHTML = "<h1>Already Verified</h1>" +
                    "<p>It appears this email has already been confirmed. " +
                    "You can return to the <b>CRE Dev Sim</b> application and log in now.</p>";
            }
            else if (hash.includes("error")) {
                messageBox.innerHTML = "<h1>Verification Failed</h1>" +
                    "<p>There was an issue verifying your email. Please try again or contact support.</p>";
            }
            else {
                // Success State
                messageBox.innerHTML = "<h1>Account Verified!</h1>" +
                    "<p>Your email has been confirmed. You can now return to the <b>CRE Dev Sim</b> application and log in.</p>";
            }
        }

        window.onload = updateMessage;
    </script>
</body>
</html>
